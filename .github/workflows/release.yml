name: release

# Mints the version on merge to main and promotes the already-built image.
#
# Ported from the aasanezoo-web .husky/pre-push auto-tagger, which cannot
# survive a PR workflow: it keys on a LOCAL push to refs/heads/main, and under
# a PR flow main advances server-side, so the hook never fires and tagging
# stops silently.
#
# Order is load-bearing: derive -> retag image -> push git tag LAST, so a git
# tag never exists without the image it names.

on:
  workflow_call:
    inputs:
      # Must match the caller's node-ci/go-ci setting. When false, only the git
      # tag is minted and no registry work happens.
      publish-image: { type: boolean, default: true }
      # Coolify application uuid. When empty (the default) no deploy is
      # attempted and this workflow behaves exactly as it did before —
      # that guard is what lets apps migrate one at a time.
      coolify-app-uuid: { type: string, default: '' }
      # JSON for runs-on. Private repos on the self-hosted Acer runner pass
      # '["self-hosted","priv-ci"]'. The default stays GitHub-hosted, so this public repo and
      # every caller that does not opt in never touch the Acer. NEVER set it from a public repo.
      runner: { type: string, default: '"ubuntu-latest"' }
    secrets:
      # All three are required together to reach the Coolify API: the CF pair
      # gets past Cloudflare Access at the edge, the bearer authenticates to
      # Coolify itself. Optional so un-migrated callers need not pass them.
      COOLIFY_TOKEN:           { required: false }
      CF_ACCESS_CLIENT_ID:     { required: false }
      CF_ACCESS_CLIENT_SECRET: { required: false }

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: write       # push the tag
      packages: write       # retag in GHCR
      # Declaring permissions at all sets every unlisted scope to `none`, so
      # this must be explicit: resolving the merged PR's head SHA reads the
      # commit->PR association, which 403s without it on a private repo.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # need full history + all tags to find the base version
          fetch-tags: true

      - name: Skip if this commit is already version-tagged
        id: guard
        run: |
          set -euo pipefail
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v[0-9]'; then
            echo "already tagged: $(git tag --points-at "$GITHUB_SHA" | tr '\n' ' ')"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive version from the squash commit title
        id: ver
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail

          # With squash merge the commit landing on main IS the PR title, so a
          # single commit carries the whole semver signal. This is why the PR
          # title is a required, linted status check.
          subject=$(git log -1 --format='%s' "$GITHUB_SHA")
          body=$(git log -1 --format='%b' "$GITHUB_SHA")
          echo "subject: $subject"

          last_v=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -n "$last_v" ]; then
            base="${last_v#v}"
          elif [ -f package.json ]; then
            # jq, not node: this job has no setup-node, and the self-hosted runner
            # image ships no node, so `node -p` fell through to 0.0.0 silently.
            base=$(jq -r '.version // "0.0.0"' package.json 2>/dev/null || echo "0.0.0")
          else
            base="0.0.0"
          fi

          # Anything that is not a bare X.Y.Z would break the arithmetic below
          # under `set -u`. Refuse to guess; start from zero.
          case "$base" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unusable base version '${base}', falling back to 0.0.0"; base="0.0.0" ;;
          esac

          major="${base%%.*}"; rest="${base#*.}"
          minor="${rest%%.*}"; patch="${rest#*.}"
          patch="${patch%%[-+]*}"   # drop any prerelease/build suffix

          level="patch"
          if printf '%s\n' "$subject" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' \
             || printf '%s\n' "$body" | grep -q 'BREAKING CHANGE'; then
            level="major"
          elif printf '%s\n' "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
            level="minor"
          fi

          case "$level" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${new}" >/dev/null 2>&1; then
            echo "::error::tag ${new} already exists — refusing to move it"
            exit 1
          fi

          echo "base=${base} level=${level} new=${new}"
          echo "version=${new}" >> "$GITHUB_OUTPUT"

      # Which version this run releases: the one just derived, or (re-run of an already-tagged
      # commit) that commit's tag. A re-run never deploys -- it would undo a manual tag-swap
      # rollback -- it only creates the Release if it is missing.
      - name: Resolve the version to release
        id: v
        env:
          SKIP: ${{ steps.guard.outputs.skip }}
          NEW:  ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = "true" ]; then
            ver=$(git tag --points-at "$GITHUB_SHA" | grep '^v[0-9]' | sort -V | tail -n1)
          else
            ver="$NEW"
          fi
          echo "version=${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Resolve the PR head SHA this merge came from
        id: head
        if: steps.guard.outputs.skip == 'false' && inputs.publish-image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The image was built and smoke-tested on the BRANCH, whose SHA the
          # squash merge discarded. Recover it via the commit->PR association.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                   --jq '.[0].head.sha // empty')
          if [ -z "$head" ]; then
            echo "::error::no PR is associated with ${GITHUB_SHA}."
            echo "::error::A direct push to main has no tested image to promote."
            exit 1
          fi
          echo "head=${head}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.guard.outputs.skip == 'false' && inputs.publish-image
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested image to ${{ steps.ver.outputs.version }}
        if: steps.guard.outputs.skip == 'false' && inputs.publish-image
        env:
          HEAD: ${{ steps.head.outputs.head }}
          VER:  ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # imagetools create is a registry-side manifest copy: no pull, no
          # rebuild, no layer transfer. The bytes are the tested bytes.
          docker buildx imagetools create \
            -t "${IMAGE}:${VER}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:sha-${HEAD}"
          echo "promoted ${IMAGE}:sha-${HEAD} -> ${VER} + latest"

      # LAST: only now does the version become real.
      - name: Push git tag
        id: tag
        if: steps.guard.outputs.skip == 'false'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VER" -m "$VER"
          git push origin "refs/tags/$VER"
          echo "tagged $VER"
          # NOTE: tags pushed with GITHUB_TOKEN do NOT trigger further
          # workflows (GitHub loop prevention). Harmless today; Phase 2's
          # tag-triggered deploy will need a PAT or app token.

      # One copy of the Release state-line writer, sourced by the steps below. always(): the
      # Mark step must find it even when an earlier step failed.
      - name: Write the Release state helper
        if: always()
        run: |
          cat > "$RUNNER_TEMP/release-state.sh" <<'SH'
          # set_state LINE [--latest]: replace the Release's state line (or prepend one), keep the notes.
          set_state() {
            if ! gh release view "$VER" --json body -q .body > "$RUNNER_TEMP/raw.md" 2>/dev/null; then
              # The Create step failed: make the Release here, so a good deploy is still recorded.
              printf '%s\n' "$1" > "$RUNNER_TEMP/new.md"
              gh release create "$VER" --verify-tag --generate-notes --title "$VER" \
                --latest=false --notes-file "$RUNNER_TEMP/new.md"
              if [ -n "${2:-}" ]; then gh release edit "$VER" "$2"; fi
              echo "Release ${VER} (created late): $1"
              return 0
            fi
            # gh adds a trailing newline; drop trailing blank lines so edits never accumulate them
            awk 'NF{for(;n>0;n--)print "";print;next}{n++}' "$RUNNER_TEMP/raw.md" > "$RUNNER_TEMP/body.md"
            if head -n1 "$RUNNER_TEMP/body.md" | grep -qE '^(⏳|✅|❌|❔|⏸|↩)'; then
              tail -n +2 "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/rest.md"
            else
              cp "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/rest.md"
            fi
            { printf '%s\n' "$1"; cat "$RUNNER_TEMP/rest.md"; } > "$RUNNER_TEMP/new.md"
            gh release edit "$VER" --notes-file "$RUNNER_TEMP/new.md" ${2:+"$2"}
            echo "Release ${VER}: $1"
          }
          SH

      # ---- Coolify: point the app at the version just promoted, then deploy ----
      # Guarded on coolify-app-uuid so repos that have not migrated are untouched.
      #
      # Why two calls: /deploy accepts a docker_tag input but rejects it unless
      # pull_request_id is also set ("docker_tag requires pull_request_id",
      # DeployController.php). So the tag must be persisted on the application
      # first. This is a constraint of the API, not a style choice.
      #
      # Base URL is the public, Cloudflare-Access-gated endpoint: a GitHub-hosted
      # runner cannot reach kvm4's loopback :8000.
      - name: Set APP_VERSION on the Coolify application
        if: steps.guard.outputs.skip == 'false' && inputs.publish-image && inputs.coolify-app-uuid != ''
        env:
          UUID:   ${{ inputs.coolify-app-uuid }}
          VER:    ${{ steps.v.outputs.version }}
          BEARER: ${{ secrets.COOLIFY_TOKEN }}
          CFID:   ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CFSEC:  ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BEARER:-}" ] || [ -z "${CFID:-}" ] || [ -z "${CFSEC:-}" ]; then
            echo "::error::coolify-app-uuid was set but one or more Coolify secrets are missing."
            echo "::error::Need COOLIFY_TOKEN, CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET."
            exit 1
          fi
          # SOURCE_COMMIT is not populated for a dockerimage build pack, so the
          # running version has to be injected explicitly.
          #
          # Uses the /envs/bulk endpoint, NOT plain PATCH /envs: the plain
          # endpoint only UPDATES and returns 404 "Environment variable not
          # found." when the key does not exist yet, so the very first release
          # for each app would fail. /envs/bulk upserts.
          # Verified non-destructive (create_bulk_envs iterates the submitted
          # items and updates-or-creates each; it contains no delete/whereNotIn),
          # so this cannot disturb DATABASE_URL or the ACCESS_* vars.
          # Note the success status is 201, not 200.
          code=$(curl -sS -o /tmp/env.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${BEARER}" \
            -H "CF-Access-Client-Id: ${CFID}" \
            -H "CF-Access-Client-Secret: ${CFSEC}" \
            -H 'Content-Type: application/json' \
            -d "{\"data\":[{\"key\":\"APP_VERSION\",\"value\":\"${VER}\",\"is_buildtime\":false,\"is_runtime\":true,\"is_preview\":false}]}" \
            "https://coolify.brandtstack.com/api/v1/applications/${UUID}/envs/bulk")
          echo "APP_VERSION upsert -> ${code}"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then cat /tmp/env.json; exit 1; fi

      - name: Point the Coolify application at ${{ steps.v.outputs.version }}
        if: steps.guard.outputs.skip == 'false' && inputs.publish-image && inputs.coolify-app-uuid != ''
        env:
          UUID:   ${{ inputs.coolify-app-uuid }}
          VER:    ${{ steps.v.outputs.version }}
          BEARER: ${{ secrets.COOLIFY_TOKEN }}
          CFID:   ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CFSEC:  ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${BEARER}" \
            -H "CF-Access-Client-Id: ${CFID}" \
            -H "CF-Access-Client-Secret: ${CFSEC}" \
            -H 'Content-Type: application/json' \
            -d "{\"docker_registry_image_tag\":\"${VER}\"}" \
            "https://coolify.brandtstack.com/api/v1/applications/${UUID}")
          echo "image tag PATCH -> ${code}"
          if [ "$code" != "200" ]; then cat /tmp/patch.json; exit 1; fi

      # The only step that touches production. A failure here leaves the git tag and the
      # registry correct. A re-run does NOT redeploy (see Resolve); trigger /deploy by hand.
      - name: Deploy
        id: deploy
        if: steps.guard.outputs.skip == 'false' && inputs.publish-image && inputs.coolify-app-uuid != ''
        env:
          UUID:   ${{ inputs.coolify-app-uuid }}
          BEARER: ${{ secrets.COOLIFY_TOKEN }}
          CFID:   ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CFSEC:  ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${BEARER}" \
            -H "CF-Access-Client-Id: ${CFID}" \
            -H "CF-Access-Client-Secret: ${CFSEC}" \
            "https://coolify.brandtstack.com/api/v1/deploy?uuid=${UUID}")
          echo "deploy -> ${code}"
          cat /tmp/deploy.json
          if [ "$code" != "200" ]; then exit 1; fi
          echo "deployment queued for ${UUID}"
          echo "queued=true" >> "$GITHUB_OUTPUT"
          dep=$(jq -r '.deployments[0].deployment_uuid // empty' /tmp/deploy.json)
          if [ -z "$dep" ]; then
            echo "::error::/deploy returned no deployment_uuid; cannot confirm the deploy."
            exit 1
          fi
          echo "deployment_uuid=${dep}" >> "$GITHUB_OUTPUT"

      # The repo's "Latest" Release is the version running in production. It runs after Deploy, so
      # a GitHub hiccup here never stops a deploy, and whenever the tag exists (!cancelled()), so a
      # failed Coolify step still leaves a Release for the Mark step to label. A Coolify app starts
      # "⏳ deploying", not Latest; the Wait step promotes it. A tag-only caller is Latest at once.
      # A re-run creates a missing Release as "❔" and touches nothing else. Notes are the PR titles
      # since the previous v* tag (gh prepends --notes-file text to the generated notes).
      - name: Create the GitHub Release
        if: ${{ !cancelled() && steps.v.outputs.version != '' && (steps.tag.outcome == 'success' || steps.guard.outputs.skip == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER:  ${{ steps.v.outputs.version }}
          SKIP: ${{ steps.guard.outputs.skip }}
          WAIT: ${{ inputs.publish-image && inputs.coolify-app-uuid != '' }}
        run: |
          set -euo pipefail
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Release ${VER} exists"
            exit 0
          fi
          if [ "$SKIP" = "true" ]; then
            printf '%s\n' "❔ created on re-run; deploy state not checked" > "$RUNNER_TEMP/notes.md"; latest="--latest=false"
          elif [ "$WAIT" = "true" ]; then
            printf '%s\n' "⏳ deploying" > "$RUNNER_TEMP/notes.md"; latest="--latest=false"
          else
            : > "$RUNNER_TEMP/notes.md"; latest="--latest"
          fi
          for try in 1 2 3; do
            if gh release create "$VER" --verify-tag --generate-notes --title "$VER" \
                 "$latest" --notes-file "$RUNNER_TEMP/notes.md"; then
              echo "created Release ${VER} (${latest})"
              exit 0
            fi
            [ "$try" = 3 ] || sleep "${RETRY_SLEEP:-5}"
          done
          echo "::error::could not create Release ${VER}; the deploy is unaffected (the Wait step creates it late)."
          exit 1

      # "Deploy" only queues. Poll until Coolify reports a terminal status, then mark the Release.
      # Whatever the status, if the app no longer points at $VER a newer merge took over:
      # superseded (and an older deploy finishing last must not take Latest). Otherwise finished
      # -> Latest; failed/cancelled/error -> failed; no terminal status in time -> unknown. The last
      # two fail the job. A non-200 poll (Access edge, Coolify restarting) is retried until the
      # timeout. Response bodies are never printed and never outlive the step: the deployment
      # record embeds the application, env included.
      - name: Wait for the deployment and mark the Release
        id: wait
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.guard.outputs.skip == 'false' && inputs.publish-image && inputs.coolify-app-uuid != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VER:    ${{ steps.v.outputs.version }}
          UUID:   ${{ inputs.coolify-app-uuid }}
          DEP:    ${{ steps.deploy.outputs.deployment_uuid }}
          BEARER: ${{ secrets.COOLIFY_TOKEN }}
          CFID:   ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CFSEC:  ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          POLL_INTERVAL: '10'
          POLL_TIMEOUT:  '600'
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release-state.sh"
          API="https://coolify.brandtstack.com/api/v1"
          R="$RUNNER_TEMP/coolify.json"
          trap 'rm -f "$R"' EXIT
          get() {   # $1 = API path; prints the HTTP code, body goes to $R
            curl -sS --max-time 15 -o "$R" -w '%{http_code}' \
              -H "Authorization: Bearer ${BEARER}" \
              -H "CF-Access-Client-Id: ${CFID}" \
              -H "CF-Access-Client-Secret: ${CFSEC}" \
              "${API}$1" 2>/dev/null || echo 000
          }
          field() { jq -r "$1 // empty" "$R" 2>/dev/null || true; }   # non-JSON body -> ""

          status=timeout
          deadline=$(( $(date +%s) + POLL_TIMEOUT ))
          while :; do
            code=$(get "/deployments/${DEP}")
            if [ "$code" = "200" ]; then
              s=$(field .status)
              case "$s" in
                finished|failed|cancelled-by-user|error) status="$s"; break ;;
              esac
              echo "deployment ${DEP}: ${s:-unknown}"
            else
              echo "deployment poll -> HTTP ${code}, retrying"
            fi
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep "$POLL_INTERVAL"
          done

          echo "deployment ${DEP} ended: ${status}"
          if [ "$status" = "timeout" ]; then
            set_state "❔ deploy state unknown (timeout)"
            echo "::error::Coolify deployment ${DEP} did not finish within ${POLL_TIMEOUT}s."
            exit 1
          fi

          cur=""
          if [ "$(get "/applications/${UUID}")" = "200" ]; then cur=$(field .docker_registry_image_tag); fi
          if [ -n "$cur" ] && [ "$cur" != "$VER" ]; then
            set_state "⏸ superseded by ${cur}"
            echo "deployment ${DEP} ended '${status}'; the app has moved on to ${cur}"
          elif [ "$status" = "finished" ]; then
            # An unreadable app record after a finished deploy is still a finished deploy.
            [ -n "$cur" ] || echo "::warning::could not read the app's image tag; marking ${VER} live"
            set_state "✅ live in production $(date -u +%Y-%m-%dT%H:%M:%SZ)" --latest
          else
            set_state "❌ deploy failed (${status})"
            echo "::error::Coolify deployment ${DEP} ended '${status}'; ${VER} is not in production."
            exit 1
          fi

      # A Coolify step before the wait failed, so the Wait step never ran and the Release (created
      # above anyway) still says "⏳ deploying". If /deploy had already queued it, say "unconfirmed". Gated on Wait being SKIPPED: when Wait itself ran
      # and failed (say a gh error after a good deploy), it is not "never started".
      - name: Mark a Release whose deploy never started
        if: failure() && steps.guard.outputs.skip == 'false' && steps.wait.outcome == 'skipped' && inputs.publish-image && inputs.coolify-app-uuid != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.version }}
          QUEUED: ${{ steps.deploy.outputs.queued }}
        run: |
          set -euo pipefail
          [ -n "$VER" ] && [ -f "$RUNNER_TEMP/release-state.sh" ] || exit 0
          . "$RUNNER_TEMP/release-state.sh"
          first=$(gh release view "$VER" --json body -q .body 2>/dev/null | head -n1 || true)
          if [ "$first" != "⏳ deploying" ]; then exit 0; fi
          if [ "${QUEUED:-}" = "true" ]; then
            set_state "❔ deploy queued; state not confirmed"   # /deploy said yes, then gave no uuid to poll
          else
            set_state "❌ deploy not started"
          fi
