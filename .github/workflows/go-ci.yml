name: go-ci

on:
  workflow_call:
    inputs:
      go-version:        { type: string,  default: '1.27' }
      node-version:      { type: string,  default: '24' }
      needs-postgres:    { type: boolean, default: false }
      postgres-db:       { type: string,  default: 'test' }
      smoke:             { type: boolean, default: true }
      smoke-port:        { type: string,  default: '80' }
      smoke-path:        { type: string,  default: '/' }
      smoke-run-args:    { type: string,  default: '' }
      docker-build-args: { type: string,  default: '' }
      publish-image:     { type: boolean, default: true }
      # JSON for runs-on. Private repos on the self-hosted Acer runner pass
      # '["self-hosted","priv-ci"]'. The default stays GitHub-hosted, so this public repo and
      # every caller that does not opt in never touch the Acer. NEVER set it from a public repo.
      runner:            { type: string,  default: '"ubuntu-latest"' }

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: make verify

      # govulncheck judges the stdlib of the Go on PATH, and setup-go above takes the runner's
      # cached patch (go1.27.1 on the Acer, 2026-11-09) while every image builds FROM
      # golang:<go-version>-alpine, i.e. the latest patch. Scanned with the cached one, all six Go
      # repos reported 5-12 reachable stdlib vulns that the images do not ship (and 0 with 1.27.3).
      # So this second setup-go fetches the latest patch, after `make verify` has run on the first.
      #
      # Policy (Adrian, 2026-11-09): this check FAILS anything but a push, and only WARNS on a push,
      # because release `needs: ci` and a vuln published between a green PR and its merge must not
      # strand that deploy. That covers infrastructure failures too (no manifest, no proxy, a full
      # disk), hence continue-on-error on a push for both steps, not only the scanner's own exit.
      - name: Set up the latest Go ${{ inputs.go-version }} patch for govulncheck
        id: vulngo
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache: false

      # Reached only on a push whose setup failed (on any other event that failure already failed
      # the job). Scanning with the cached patch instead would report vulns the images do not ship.
      - name: govulncheck skipped (no latest Go patch)
        if: steps.vulngo.outcome == 'failure'
        env:
          GO_VERSION: ${{ inputs.go-version }}
        run: |
          echo "::warning::govulncheck did not run - the latest Go ${GO_VERSION} patch could not be set up (push: not blocking the release)"

      # Every module in the repo (git ls-files, so cc-usage's server/go.mod counts). Exit 3 means a
      # reachable vuln; any other non-zero exit is a scanner error. Both fail, except on a push.
      # Offline rows: tests/go-ci/test_govulncheck.py.
      - name: govulncheck
        if: steps.vulngo.outcome == 'success'
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          GOVULNCHECK_VERSION: v1.9.0
          ENFORCE: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail
          # Building govulncheck from cold took ~104 s of a 112 s step (bcli, Acer, 2026-11-09); the
          # scan itself ~7 s. So keep the binary in the runner tool cache (on the Acer, the shared
          # ci-toolcache volume), keyed by scanner version + exact Go patch: built once per release.
          # Build in a temp dir beside the target (same filesystem, so the mv is an atomic rename):
          # two jobs building at once can never leave a half-written binary in place.
          # ⚠️ Trust: a cache hit is trusted by path. Any job on the Acer can write this volume, so
          # one repo's PR code could plant a binary another repo then runs. Accepted, as for the Go
          # toolchain setup-go caches in the same volume: every repo on this runner is private and
          # Adrian's (infra/reference/ci-runner.md). A checksum kept on the same volume adds nothing.
          root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/govulncheck"
          bin="$root/${GOVULNCHECK_VERSION}-$(go env GOVERSION)"
          tmp=""
          trap '[ -z "$tmp" ] || rm -rf "$tmp"' EXIT
          if [ ! -x "$bin" ]; then
            mkdir -p "$root"
            tmp=$(mktemp -d "$root/.build.XXXXXX")
            GOBIN="$tmp" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
            mv -f "$tmp/govulncheck" "$bin"
          fi
          "$bin" -version
          mods=$(git ls-files -- ':(glob)**/go.mod')
          if [ -z "$mods" ]; then
            echo "::error::govulncheck: no go.mod tracked in this repo"
            exit 1
          fi
          worst=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "::group::govulncheck ${dir}"
            rc=0
            (cd "$dir" && "$bin" ./... </dev/null) || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 3 ]; then
              msg="govulncheck: reachable vulnerabilities in module ${dir} (expand the group above)"
            elif [ "$rc" -ne 0 ]; then
              msg="govulncheck: scanner error (exit ${rc}) in module ${dir}"
            else
              echo "govulncheck: ${dir} clean"
              continue
            fi
            if [ "$ENFORCE" = true ]; then echo "::error::${msg}"; else echo "::warning::${msg} (push: not blocking the release)"; fi
            worst=1
          done <<< "$mods"
          if [ "$worst" -ne 0 ] && [ "$ENFORCE" = true ]; then exit 1; fi

  integration:
    if: inputs.needs-postgres
    runs-on: ${{ fromJSON(inputs.runner) }}
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ inputs.postgres-db }}?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: make verify-integration

  # New: the Go pipeline had no image job at all, so dmarc-digest never built
  # its production image in CI and had nothing to publish or roll back to.
  #
  # NOTE: no in-container loopback check here, unlike node-ci. Go services
  # build to distroless, which has no shell and no wget — `docker exec` cannot
  # run anything. External reachability is the only smoke test available.
  image:
    if: inputs.publish-image && github.event_name == 'pull_request'
    needs: verify
    runs-on: ${{ fromJSON(inputs.runner) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image ref and head SHA
        id: meta
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ci-image:local
          build-args: ${{ inputs.docker-build-args }}

      - name: Boot and smoke test
        if: inputs.smoke
        env:
          PORT:  ${{ inputs.smoke-port }}
          RPATH: ${{ inputs.smoke-path }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p "8080:${PORT}" ${{ inputs.smoke-run-args }} ci-image:local
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8080${RPATH}" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::container never answered on published port ${PORT}${RPATH}"
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi
          echo "external reachability OK"

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish :sha-<head> to GHCR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          HEAD:  ${{ steps.meta.outputs.head }}
        run: |
          set -euo pipefail
          docker tag ci-image:local "${IMAGE}:sha-${HEAD}"
          docker push "${IMAGE}:sha-${HEAD}"
          echo "published ${IMAGE}:sha-${HEAD}"
