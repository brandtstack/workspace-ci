name: go-ci

on:
  workflow_call:
    inputs:
      go-version:        { type: string,  default: '1.27' }
      node-version:      { type: string,  default: '24' }
      needs-postgres:    { type: boolean, default: false }
      postgres-db:       { type: string,  default: 'test' }
      smoke:             { type: boolean, default: true }
      smoke-port:        { type: string,  default: '80' }
      smoke-path:        { type: string,  default: '/' }
      smoke-run-args:    { type: string,  default: '' }
      docker-build-args: { type: string,  default: '' }
      publish-image:     { type: boolean, default: true }

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: make verify

  integration:
    if: inputs.needs-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ inputs.postgres-db }}?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: make verify-integration

  # New: the Go pipeline had no image job at all, so dmarc-digest never built
  # its production image in CI and had nothing to publish or roll back to.
  #
  # NOTE: no in-container loopback check here, unlike node-ci. Go services
  # build to distroless, which has no shell and no wget — `docker exec` cannot
  # run anything. External reachability is the only smoke test available.
  image:
    if: inputs.publish-image && github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image ref and head SHA
        id: meta
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ci-image:local
          build-args: ${{ inputs.docker-build-args }}

      - name: Boot and smoke test
        if: inputs.smoke
        env:
          PORT:  ${{ inputs.smoke-port }}
          RPATH: ${{ inputs.smoke-path }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p "8080:${PORT}" ${{ inputs.smoke-run-args }} ci-image:local
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:8080${RPATH}" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::container never answered on published port ${PORT}${RPATH}"
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi
          echo "external reachability OK"

      - name: Tear down
        if: always()
        run: docker rm -f smoke || true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish :sha-<head> to GHCR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          HEAD:  ${{ steps.meta.outputs.head }}
        run: |
          set -euo pipefail
          docker tag ci-image:local "${IMAGE}:sha-${HEAD}"
          docker push "${IMAGE}:sha-${HEAD}"
          echo "published ${IMAGE}:sha-${HEAD}"
