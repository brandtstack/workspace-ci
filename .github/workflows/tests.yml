name: tests

# This repo's own tests. This repo is PUBLIC: GitHub-hosted runners only, never the Acer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline tests for pr-review.yml
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/venv/bin/python" tests/pr-review/test_pr_review.py
      - name: Offline tests for release.yml's Release steps
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/release/test_release.py
      # Renovate reads default.json (the shared preset) and renovate.json. Named explicitly: with no
      # arguments the validator checks renovate.json only. --strict makes a config that Renovate would
      # have to auto-migrate fail the job. It does not resolve `extends` presets, so a misspelt preset
      # name still passes; it checks option names and types.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Renovate config
        run: npx --yes --package renovate@44.126.0 -- renovate-config-validator --strict default.json renovate.json
