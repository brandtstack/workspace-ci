name: tests

# This repo's own tests. This repo is PUBLIC: GitHub-hosted runners only, never the Acer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline tests for pr-review.yml
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/venv/bin/python" tests/pr-review/test_pr_review.py
