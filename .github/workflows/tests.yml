name: tests

# This repo's own tests. This repo is PUBLIC: GitHub-hosted runners only, never the Acer.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Offline tests for pr-review.yml
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/venv/bin/python" tests/pr-review/test_pr_review.py
      - name: Offline tests for release.yml's Release steps
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/release/test_release.py
      - name: Offline tests for app.yml's govulncheck steps
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/app/test_govulncheck.py
      - name: Offline tests for app.yml's favicon step
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/app/test_favicon.py
      - name: Tests for the build.yml contract reader
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/contract/test_contract.py
      - name: Offline shape tests for app.yml
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/app/test_app_shape.py
      - name: Offline run of app.yml's smoke-support steps (fake docker)
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/app/test_app_steps.py
      - name: No shared Dockerfile runs a gate
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/dockerfiles/test_no_gate.py
      - name: next start.sh behaviour (stubbed node)
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/dockerfiles/test_start_sh.py
      - name: Tests for scripts/build-image (fake podman)
        run: |
          "$RUNNER_TEMP/venv/bin/python" tests/build-image/test_build_image.py
      # Renovate reads default.json (the shared preset) and renovate.json. Named explicitly: with no
      # arguments the validator checks renovate.json only. --strict makes a config that Renovate would
      # have to auto-migrate fail the job. It does not resolve `extends` presets, so a misspelt preset
      # name still passes; it checks option names and types.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Renovate config
        run: npx --yes --package renovate@44.126.0 -- renovate-config-validator --strict default.json renovate.json
      # Negative fixture. A `uses:` job has no steps and no continue-on-error, so a failing app.yml call
      # cannot be asserted from here; the reader is asserted directly. app.yml's shape test pins that the
      # contract step is verify's first real step and that image/integration `needs: verify`.
      - name: Contract reader rejects the bad-contract fixture
        run: |
          set -u
          rc=0
          err="$(bash contract/read.sh fixtures/bad-contract/.github/build.yml 2>&1 >/dev/null)" || rc=$?
          echo "exit $rc: $err"
          [ "$rc" -eq 1 ] || { echo "::error::expected exit 1 from the reader"; exit 1; }
          case "$err" in *familly*) ;; *) echo "::error::stderr does not name familly"; exit 1 ;; esac

  # Negative: app.yml's "Custom go image HEALTHCHECK" step run against a real image that declares none. The
  # step's script is read out of app.yml itself, so this tests what the workflow runs.
  custom-go-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A custom go image without a HEALTHCHECK fails the gate
        run: |
          set -u
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check PyYAML==6.0.3
          # An empty image: no layers, so no HEALTHCHECK and nothing to run.
          tar -cT /dev/null | docker import - ci-image:local
          "$RUNNER_TEMP/venv/bin/python" - > "$RUNNER_TEMP/gate.sh" <<'PY'
          import yaml
          wf = yaml.safe_load(open(".github/workflows/app.yml"))
          print([s for s in wf["jobs"]["image"]["steps"] if s.get("name") == "Custom go image HEALTHCHECK"][0]["run"])
          PY
          rc=0
          out="$(bash -eo pipefail "$RUNNER_TEMP/gate.sh" 2>&1)" || rc=$?
          echo "exit $rc: $out"
          [ "$rc" -eq 1 ] || { echo "::error::expected exit 1 from the gate"; exit 1; }
          case "$out" in *"custom go image has no HEALTHCHECK"*) ;; *) echo "::error::output does not name the missing HEALTHCHECK"; exit 1 ;; esac

  # release.yml's skipped-checks guard against real images in a throwaway local registry, with the real buildx. The
  # step's script is read out of release.yml itself; only the registry host is swapped.
  skipped-image-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ['5000:5000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A labelled image is refused, an unlabelled one passes, an unreadable one fails closed
        run: |
          set -u
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --disable-pip-version-check PyYAML==6.0.3
          "$RUNNER_TEMP/venv/bin/python" - > "$RUNNER_TEMP/gate.sh" <<'PY'
          import yaml
          wf = yaml.safe_load(open(".github/workflows/release.yml"))
          step = [s for s in wf["jobs"]["release"]["steps"] if s.get("name") == "Refuse to deploy an image whose checks were skipped"][0]
          print(step["run"].replace("ghcr.io/", "127.0.0.1:5000/"))
          PY
          # The step builds its image name from GITHUB_REPOSITORY, which a step cannot override.
          img="127.0.0.1:5000/${GITHUB_REPOSITORY,,}"
          tar -cT /dev/null | docker import --change 'LABEL workspace-ci.image-checks-skipped=true' - "${img}:sha-skipped"
          tar -cT /dev/null | docker import --change 'LABEL other=1' - "${img}:sha-checked"
          docker push -q "${img}:sha-skipped"
          docker push -q "${img}:sha-checked"
          rc=0; out="$(HEAD=skipped bash "$RUNNER_TEMP/gate.sh" 2>&1)" || rc=$?
          echo "skipped: exit $rc: $out"
          [ "$rc" -eq 1 ] || { echo "::error::expected the labelled image to be refused"; exit 1; }
          case "$out" in *"built with skip-image-checks"*) ;; *) echo "::error::refused for the wrong reason"; exit 1 ;; esac
          rc=0; out="$(HEAD=checked bash "$RUNNER_TEMP/gate.sh" 2>&1)" || rc=$?
          echo "checked: exit $rc: $out"
          [ "$rc" -eq 0 ] || { echo "::error::expected the unlabelled image to pass"; exit 1; }
          case "$out" in *"image checks ran"*) ;; *) echo "::error::the guard did not read the labels"; exit 1 ;; esac
          rc=0; out="$(HEAD=missing bash "$RUNNER_TEMP/gate.sh" 2>&1)" || rc=$?
          echo "missing: exit $rc: $out"
          [ "$rc" -eq 1 ] || { echo "::error::an unreadable image must fail closed"; exit 1; }
          case "$out" in *"after 3 tries"*) ;; *) echo "::error::expected the could-not-read error"; exit 1 ;; esac

  # The fixture apps run through the real contract workflow, same-repo (so the ref check applies).
  # Public repo: GitHub-hosted runners only, never the Acer. app.yml's publish steps are off in this repo.
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        family: [next, next-dotenvx, next-multischema, spa, go, custom-node, custom-go, custom-no-boot]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/app.yml
    with:
      runner: '"ubuntu-latest"'
      path: fixtures/${{ matrix.family }}
