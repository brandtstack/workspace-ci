server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/healthz.conf;

  # Fixture only: reports what the start hook wrote into the writable runtime dir.
  location = /hook {
    include /etc/nginx/runtime/fixture-hook.conf;
    default_type text/plain;
    return 200 "$fixture_hook\n";
  }

  location / {
    try_files $uri /index.html;
  }
}
